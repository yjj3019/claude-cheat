name: Prompt cache

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache:
    name: Prompt cache verification
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify actual prefix reuse and the generated answer
        run: python -B tests/run_prompt_cache_check.py
      - name: Verify proxy cache directives and reported usage
        run: node --test tests/request_rewrite.test.mjs tests/usage_instrument.test.mjs tests/routingObservability.test.mjs
      - name: Verify CLI usage through the proxy and ledger
        env:
          PYTHONPATH: '.;tests'
        run: python -B -m unittest test_cli_backend test_usage_end_to_end test_usage_ledger
